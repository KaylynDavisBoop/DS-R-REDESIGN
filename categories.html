<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DS+R — Categories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Saira+Extra+Condensed:wght@400;500;600&family=Archivo:wdth,wght@125,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/categories.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <main class="categories-page">
    <header class="nav">
      <a class="logo" href="index.html" aria-label="DS+R home">
        <img src="images/categories/logo-dsr.png" alt="DS+R">
      </a>
      <nav class="nav-links" id="nav-links" aria-label="Primary">
        <a href="index.html#about">Studio</a>
        <a href="contact.html">Contact</a>
        <a href="news.html">News</a>
        <a href="meet-us.html">Meet Us</a>
      </nav>
      <button class="sandwich" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav-links">
        <span></span><span></span><span></span>
      </button>
    </header>

    <img class="category-arrow" src="images/categories/arrow.svg" alt="" aria-hidden="true">
    <img class="category-arrow-group" src="images/categories/arrow-group.svg" alt="" aria-hidden="true">
    <h1>Categories</h1>

    <section class="category-grid" aria-label="Project categories">
      <a class="category-card category-card--cultural" href="cultural.html">
        <img src="images/categories/cultural.png" alt="">
        <span class="category-card__caption">
          <strong>Cultural</strong>
          <small>Spaces for Art</small>
        </span>
      </a>
      <a class="category-card category-card--public" href="#">
        <img src="images/categories/public-space.png" alt="">
        <span class="category-card__caption">
          <strong>Public Space</strong>
          <small>Parks/Plazas</small>
        </span>
      </a>
      <a class="category-card category-card--education" href="#">
        <img src="images/categories/education.jpeg" alt="">
        <span class="category-card__caption">
          <strong>Education</strong>
          <small>Schools/Campuses</small>
        </span>
      </a>
      <a class="category-card category-card--commercial" href="#">
        <img src="images/categories/commercial.jpeg" alt="">
        <span class="category-card__caption">
          <strong>Commercial</strong>
          <small>Work Places/Shops</small>
        </span>
      </a>
    </section>
  </main>
</body>
</html>
